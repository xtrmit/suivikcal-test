<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FFF8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1716" media="(prefers-color-scheme: dark)">
<meta name="description" content="SuiviKcal — le suivi des calories, doux et sans stress.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SuiviKcal">
<title>SuiviKcal</title>
<link rel="manifest" id="manifest" href="manifest.webmanifest">
<link rel="icon" id="favicon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="appleIcon" href="icons/apple-touch-icon.png">
<script>
  /* Environnement : prod = github.io/suivikcal/, test = github.io/suivikcal-test/, sinon local (PC). */
  (function(){
    var h=location.hostname, p=location.pathname;
    var env = /github\.io$/.test(h) ? (/suivikcal-test\//.test(p) ? 'test' : 'prod') : 'local';
    window.SK_ENV = env;
    if (env !== 'prod') {
      document.getElementById('manifest').href = 'manifest-test.webmanifest';
      document.getElementById('favicon').href = 'icons/test-icon.svg';
      document.getElementById('appleIcon').href = 'icons/test-apple-touch-icon.png';
      document.title = 'SuiviKcal ' + env.toUpperCase();
      document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'SuiviKcal T';
    }
    /* Thème et taille du texte appliqués avant l'affichage, pour éviter un flash. */
    try {
      var s = JSON.parse(localStorage.getItem('suivikcal.' + env + '.donnees') || '{}').reglages || {};
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      document.documentElement.dataset.fs = String(s.fs == null ? 1 : s.fs);
    } catch (e) {}
  })();
</script>
<script src="version.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M4 14h20a10 10 0 0 1-20 0z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 10c0-3 2-5 5-5 0 3-2 5-5 5zM14 10c0-2-1.5-3.5-3.5-3.5" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"/></svg>
      <span>SuiviKcal</span><span class="tag" id="envTag" hidden></span>
    </div>
    <span class="net" id="netPill" hidden>Hors ligne</span>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Journée</span></button>
    <button data-tab="week"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 17v-4M12 17V9M16 17v-6M3 8h18"/></svg><span>Semaine</span></button>
    <button class="fab" id="fab" aria-label="Ajouter un repas"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="weight"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg><span>Poids</span></button>
    <button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Profil</span></button>
  </nav>
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" hidden></section>
  <div class="onb" id="onb" hidden></div>
  <div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastBtn" hidden></button></div>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="js/aliments.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
